name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check scripts/acceptance.mbtx
      - run: moon check scripts/acceptance.mbtx --deny-warn
      - if: runner.os == 'Windows'
        run: moon run scripts/acceptance.mbtx portable acceptance-receipt.json
      - if: runner.os != 'Windows'
        run: moon run scripts/acceptance.mbtx native acceptance-receipt.json
      - name: Verify generated interfaces remain unchanged
        run: git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti
