name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code
      - run: moon check --target all --deny-warn
      - run: moon test --target wasm --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon fmt --check scripts/e2e.mbtx
      - run: moon check scripts/e2e.mbtx --deny-warn
      - run: moon run scripts/e2e.mbtx wasm
      - run: moon fmt --check scripts/git_e2e.mbtx
      - run: moon check scripts/git_e2e.mbtx --deny-warn
      - run: moon run scripts/git_e2e.mbtx
      - run: moon fmt --check scripts/consumer.mbtx
      - run: moon check scripts/consumer.mbtx --deny-warn
      - run: moon run scripts/consumer.mbtx wasm
      - run: moon run scripts/consumer.mbtx wasm-gc
      - run: moon run scripts/consumer.mbtx js
      - if: runner.os != 'Windows'
        run: moon test --target native --deny-warn
      - if: runner.os != 'Windows'
        run: moon run scripts/e2e.mbtx native
      - if: runner.os != 'Windows'
        run: moon run scripts/consumer.mbtx native
