name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check scripts/acceptance.mbtx
      - run: moon check scripts/acceptance.mbtx --deny-warn
      - if: runner.os == 'Windows'
        run: moon run scripts/acceptance.mbtx portable acceptance-receipt.json driver-bundle
      - if: runner.os != 'Windows'
        run: moon run scripts/acceptance.mbtx native acceptance-receipt.json driver-bundle
      - name: Verify generated interfaces remain unchanged
        run: git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install reference notebook validator
        run: python -m pip install --disable-pip-version-check nbformat==5.11.1
      - name: Validate upstream corpus with Wasm
        run: moon run scripts/corpus_e2e.mbtx wasm
      - name: Validate upstream corpus with native CLI
        if: runner.os != 'Windows'
        run: moon run scripts/corpus_e2e.mbtx native
      - name: Upload verified Git driver
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mooncellmerge-driver-${{ runner.os }}
          path: driver-bundle/
          if-no-files-found: error
          retention-days: 30
